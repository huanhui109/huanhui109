<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <style>
    .bg { fill: #f5f5f7; }
    .t1 { fill: #1d1d1f; }
    .t2 { fill: #86868b; }
    .pill { fill: #0071e3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #000000; }
      .t1 { fill: #f5f5f7; }
      .t2 { fill: #a1a1a6; }
      .pill { fill: #2997ff; }
    }
  </style>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0071e3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2997ff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="900" height="260" rx="0"/>
  <circle cx="770" cy="50" r="190" fill="url(#glow)"/>
  <circle cx="860" cy="230" r="130" fill="url(#glow)" opacity="0.7"/>
  <text x="64" y="126" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', sans-serif" font-size="66" font-weight="700" letter-spacing="-1" class="t1">jason</text>
  <text x="66" y="170" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', sans-serif" font-size="20" class="t2">工程师 · 把想法变成能上手的作品</text>
  <rect class="pill" x="64" y="196" rx="15" width="172" height="30"/>
  <text x="150" y="216" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="600" fill="#ffffff">pmcore.pages.dev</text>
</svg>
